<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What AnimeCursor can do</title>
    <link rel="stylesheet" href="examples.css">
    <script src="examples.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/anime-cursor/dist/anime-cursor.umd.min.js"></script>
    <script>
        new AnimeCursor({
            //debug: true,
            cursors: {
                default: {
                    size: [32,32],
                    image: '/i/cursor/cursor_default.gif',
                    pixel: true,
                    default: true
                },
                start: {
                    tags: [''],
                    size: [48,16],
                    image: '/i/cursor/start.png',
                    frames: 13,
                    duration: 1.3,
                    pixel: true,
                    scale: [4,4],
                    offset: [24,8]
                }
            }
        })
    </script>
</head>
<body class="entry-page">
    <h1>Welcome to AnimeCursor's examples page.</h1>
    <p>Tip: Don't click the buttons immediately, hover them and watch the cursor first.</p>
    <a href="" class="start-button" data-cursor="start"><div class="start-button-bg"></div></a>
</body>
</html>
