<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <title>AnimeCursor - Lightweight JS for animated website cursors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/anime-cursor/dist/anime-cursor.umd.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            new AnimeCursor({
                //debug: true,
                cursors: {
                    default: {
                        tags: ['body'],
                        size: [32,32],
                        image: 'i/cursor/cursor_default.gif',
                        pixel: true
                    },
                    pointer: {
                        tags: ['a', 'button'],
                        size: [32,36],
                        image: 'i/cursor/cursor_pointer.png',
                        frames: 3,
                        duration: 0.3,
                        pingpong: true,
                        offset: [10, 4],
                        pixel: true
                    },
                    text: {
                        tags: ['p', 'h1', 'h2', 'span'],
                        size: [32, 32],
                        image: 'i/cursor/cursor_text.png',
                        pixel: true
                    }
                }
            });
        })
    </script>
</head>
